<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#211710">
  <meta name="description" content="A vintage western character slider inspired by Red Dead Redemption 2.">
  <title>Red Dead Redemption II | The Van der Linde Gang</title>
  <link rel="stylesheet" href="./css/all.min.css"><link rel="stylesheet" href="./css/slider.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="masthead"><div class="rule"></div><p class="eyebrow">A TALE OF LOYALTY &amp; OUTLAWS</p><h1>THE <span>VAN DER LINDE</span> GANG</h1><p class="subhead">AMERICA, 1899 &nbsp;·&nbsp; THE END OF THE OLD WEST</p><div class="rule"></div></header>
  <main>
    <section class="slider" id="slider" aria-label="Red Dead Redemption 2 character gallery">
      <div class="slide"><img id="currentImage" src="" alt="Red Dead Redemption 2 western artwork"></div>
      <div class="image-shade"></div><div class="frame-corners" aria-hidden="true"></div>
      <div class="current-caption"><p class="chapter" id="current-kicker"></p><h2 id="current-title"></h2><p id="current-description"></p><div class="caption-rule"></div><p class="wanted">WANTED — DEAD OR ALIVE</p></div>
      <div class="slide-count"><span id="current-number">01</span><i></i><span id="total-number">06</span></div>
      <div class="buttons"><button class="prev-btn" aria-label="Previous character"><i class="fa-solid fa-chevron-left"></i></button><button class="next-btn" aria-label="Next character"><i class="fa-solid fa-chevron-right"></i></button></div>
      <div class="progress"><span id="progress-bar"></span></div>
    </section>
    <footer><span>ROCKSTAR PRESENTS</span><strong>RED DEAD REDEMPTION II</strong><span>OUTLAWS FOR LIFE</span></footer>
  </main>
  <script src="./js/slider.js"></script>
</body></html>
